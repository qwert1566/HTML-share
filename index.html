<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML Share</title>
        <style>
            body {
                overflow-wrap: anywhere;
            }
        </style>
    </head>
    <body>
        <textarea placeholder="Input HTML" cols="50" rows="10"></textarea>
        <hr />
        <strong></strong>
        <script>
            document.querySelector("textarea").addEventListener("input", function () {
                if (this.value)
                    document.querySelector("strong").innerText =
                        `${location.origin}/?${new URLSearchParams({ c: btoa(encodeURIComponent(this.value)) })}`;
                else document.querySelector("strong").innerText = "";
            });
        </script>
    </body>
</html>
